# Pins the Docker API version used by docker-java, which Testcontainers 1.x bundles.
#
# Without this, docker-java falls back to API version 1.32 instead of negotiating
# with the daemon. Modern Docker daemons reject that:
#
#   client version 1.32 is too old. Minimum supported API version is 1.40,
#   please upgrade your client to a newer version
#
# The value has to sit inside the range your daemon supports. Check yours with:
#
#   docker version --format '{{.Server.APIVersion}}'
#
# This is a workaround, not the fix. Upgrading org.testcontainers to 2.0.2 or
# later makes docker-java negotiate the version with the daemon; delete this file
# when that happens rather than bumping the number again, which only postpones
# the same failure.
api.version=1.44
