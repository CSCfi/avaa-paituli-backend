# Test configuration file
quarkus.http.port=9001

# datasource configuration
quarkus.datasource.db-kind=postgresql
#quarkus.datasource.jdbc.url is defined in PostgresTestResource.java
quarkus.datasource.username=test
quarkus.datasource.password=test
quarkus.hibernate-orm.database.generation=drop-and-create

# download configuration
paituli.download.filePrefix = paituli_
paituli.download.inputPath = /tmp/
paituli.download.outputPath = /tmp
paituli.download.ftpBaseUrl = http://www.nic.funet.fi/index

# email configuration
quarkus.mailer.mock = true

# log configuration
paituli.log.salt = "batman"
